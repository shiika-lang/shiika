name: CI

on:
  push:
      branches:
        - 'main'
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Run unit tests
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up the Linux env
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt install -y libgc-dev libtinfo5

      - name: Cache LLVM and Clang on Linux
        id: cache-llvm
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            C:/Program Files/LLVM
            ./llvm
          key: llvm-18.0
      - name: Install LLVM and Clang on Linux
        if: runner.os == 'Linux'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "18.1"
          cached: ${{ steps.cache-llvm.outputs.cache-hit }}
      - name: Set up LLVM and Clang on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18
          echo "/usr/local/opt/llvm@18/bin" >> $GITHUB_PATH

      - name: Output versions
        run: |
          set -eux
          rustc --version
          cargo --version
          clang --version

      # Fails if Cargo.lock does not match Cargo.toml, so that a dependency
      # cannot be resolved to an unrecorded version on CI
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Build and test
        run: |
          set -eux
          mkdir ~/.shiika
          export SHIIKA_WORK=~/.shiika
          export SHIIKA_ROOT=.
          export RUST_BACKTRACE=1
          env -- cargo run --locked -- build packages/core
          env -- rake test
          env -- rake examples_test

  # Run cargo fmt --all -- --check
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check
